name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  step-script-tests:
    name: Step script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run step script tests
        shell: bash
        env:
          AETHER_ACTION_PATH: ${{ github.workspace }}
        run: bash "$AETHER_ACTION_PATH/tests/run-aether.test.sh"

  yaml-lint:
    name: YAML lint
    needs: step-script-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require step script tests
        if: ${{ needs.step-script-tests.result != 'success' }}
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install --user yamllint

      - name: Lint action.yml and workflows
        run: |
          cat > /tmp/yamllint-config.yml <<'EOF'
          extends: default
          rules:
            line-length:
              max: 200
              level: warning
            comments-indentation: disable
            document-start: disable
            truthy:
              check-keys: false
            indentation:
              spaces: 2
              indent-sequences: consistent
          EOF
          yamllint -c /tmp/yamllint-config.yml action.yml .github/workflows/
