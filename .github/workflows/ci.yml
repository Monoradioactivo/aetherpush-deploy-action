name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch name policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^dependabot/ ]] || [[ "$BRANCH" =~ ^release-please-- ]]; then
            echo "Skipping branch name policy for bot branch '$BRANCH'."
            exit 0
          fi
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|refactor|docs|test)/ ]]; then
            echo "::error::Branch '$BRANCH' must start with feat/, fix/, chore/, refactor/, docs/, or test/"
            exit 1
          fi
          echo "Branch '$BRANCH' is valid."

  step-script-tests:
    name: Step script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run step script tests
        shell: bash
        env:
          AETHER_ACTION_PATH: ${{ github.workspace }}
        run: bash "$AETHER_ACTION_PATH/tests/run-aether.test.sh"

  cli-install-smoke:
    name: CLI install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and inspect the pinned CLI
        run: bash tests/cli-install.test.sh

  yaml-lint:
    name: YAML lint
    needs:
      - branch-name
      - step-script-tests
      - cli-install-smoke
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the branch name policy on pull requests
        if: ${{ github.event_name == 'pull_request' && needs.branch-name.result != 'success' }}
        run: |
          echo "::error::The Branch name policy job did not succeed; see that job for the allowed prefixes."
          exit 1

      - name: Require test jobs
        if: ${{ needs.step-script-tests.result != 'success' || needs.cli-install-smoke.result != 'success' }}
        run: |
          echo "::error::Step script tests or CLI install smoke did not succeed; see those jobs."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install --user yamllint pyyaml

      - name: Lint action.yml and workflows
        run: |
          cat > /tmp/yamllint-config.yml <<'EOF'
          extends: default
          rules:
            line-length:
              max: 200
              level: warning
            comments-indentation: disable
            document-start: disable
            truthy:
              check-keys: false
            indentation:
              spaces: 2
              indent-sequences: consistent
          EOF
          yamllint -c /tmp/yamllint-config.yml action.yml .github/workflows/

      - name: Workflow run interpolation tests
        run: python3 tests/workflow-run-interpolation.test.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Release auto-merge gate tests
        run: node --test .github/scripts/release-auto-merge-gate.test.mjs
